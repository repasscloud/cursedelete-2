[workspace]
resolver = "2"
members = [
    "crates/cursdel-core",
    "crates/cursdel-policy",
    "crates/cursdel-license",
    "crates/cursdel-windows",
    "crates/cursdel-linux",
    "crates/cursdel-macos",
    "crates/cursdel-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["RePassCloud"]
license = "Apache-2.0"
repository = "https://github.com/danijeljw-RPC/cursedelete-2"
homepage = "https://github.com/danijeljw-RPC/cursedelete-2"

[workspace.dependencies]
cursdel-core = { path = "crates/cursdel-core" }
cursdel-policy = { path = "crates/cursdel-policy" }
cursdel-license = { path = "crates/cursdel-license" }
cursdel-windows = { path = "crates/cursdel-windows" }
cursdel-linux = { path = "crates/cursdel-linux" }
cursdel-macos = { path = "crates/cursdel-macos" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
num_cpus = "1"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = "0.16"
signature = "2"
hex = "0.4"
directories = "5"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2", features = ["json", "tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
ctrlc = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.bench]
inherits = "release"
