[package]
name = "cursdel-license"
description = "Product-agnostic Ed25519 licence verification, local licence storage, and the licensing-server integration boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only signing helpers (`cursdel_license::testing`) for downstream
# crates' tests. Only ever enable this from `[dev-dependencies]`: it signs
# with deterministic, publicly-known test keys.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
ml-dsa = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
ureq = { workspace = true }
directories = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
