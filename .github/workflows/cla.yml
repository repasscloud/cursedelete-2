name: Contributor License Agreement

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    name: CLA Check
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest

    steps:
      - name: Verify contributor agreement
        uses: contributor-license/cla-action@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: main
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/repasscloud/cursedelete-2/blob/main/CLA.md
          allowlist: danijeljw-RPC,claude[bot],chatgpt-codex-connector[bot]
          lock-pullrequest-aftermerge: 'true'
